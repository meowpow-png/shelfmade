<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KeepHeadingWithParagraph fixture</title>
    <link rel="stylesheet" href="../../src/runtime/pagination/pagination.css" />
    <link rel="stylesheet" href="heading-paragraph.css" />
    <script>
      window.PagedConfig = {
        after: () => {
          window.PAGED_READY = true
        },
      }
    </script>
    <script src="../../node_modules/pagedjs/dist/paged.polyfill.min.js"></script>
    <script src="../../src/runtime/pagination/break-token.js"></script>
    <script src="../../src/runtime/pagination/measurement.js"></script>
    <script src="../../src/runtime/pagination/rendered-elements.js"></script>
    <script src="../../src/runtime/pagination/keep-heading-with-paragraph.js"></script>
    <script src="../../src/runtime/pagination/min-widow-lines.js"></script>
    <script src="../../src/runtime/pagination/min-orphan-lines.js"></script>
    <script src="../../src/runtime/pagination/pagination-rules.js"></script>
  </head>
  <body>
    <!-- Only one paragraph line fits with the heading, so both move to the next page. -->
    <p>Filler</p>
    <h2>Heading</h2>
    <p>Target 1<br />Target 2<br />Target 3<br />Target 4<br />Target 5<br />Target 6</p>
  </body>
</html>
