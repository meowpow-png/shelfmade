<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Heading page start fixture</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="../../../src/runtime/pagination/pagination.css" />
    <link rel="stylesheet" href="heading-page-start.css" />
    <script>
      window.PagedConfig = {
        after: () => {
          window.PAGED_READY = true
        },
      }
    </script>
    <script src="../../../node_modules/pagedjs/dist/paged.polyfill.min.js"></script>
  </head>
  <body>
    <!-- The nested heading starts page 2 inside a chapter section, the flat
         heading starts page 3 directly in the body, and the middle heading
         follows a paragraph on page 2. -->
    <section>
      <p>Filler</p>
      <h2 class="page-start nested">Nested</h2>
      <p>Filler</p>
      <h2 class="middle">Middle</h2>
    </section>
    <h2 class="page-start flat">Flat</h2>
    <p>Filler</p>
  </body>
</html>
