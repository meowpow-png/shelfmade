name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths: &all-paths
      - 'src/**'
      - 'bin/**'
      - 'template/**'
      - 'examples/**'
      - 'tests/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.stylelintrc.json'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'knip.json'
      - 'playwright.config.ts'
      - 'docker/playwright/get-playwright-version.sh'
      - '.github/**'
  pull_request:
    branches: [main, dev]
    paths: *all-paths

jobs:
  changes:
    name: Detect Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.test == 'true' }}
      quality: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.quality == 'true' }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            test:
              - 'src/**'
              - 'bin/**'
              - 'template/**'
              - 'examples/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'docker/playwright/get-playwright-version.sh'
              - '.github/**'
            quality:
              - 'src/**'
              - 'bin/**'
              - 'template/**'
              - 'examples/**'
              - 'tests/**'
              - 'docs/**'
              - '**/*.md'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'tsconfig.json'
              - 'eslint.config.mjs'
              - '.stylelintrc.json'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'knip.json'
              - 'playwright.config.ts'
              - '.github/**'

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS: chromium firefox
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable npm
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install sample book dependencies
        run: npm run example:install

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(sh docker/playwright/get-playwright-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ env.PLAYWRIGHT_BROWSERS }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps $PLAYWRIGHT_BROWSERS

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps $PLAYWRIGHT_BROWSERS

      - name: Run tests
        id: test
        continue-on-error: true
        run: npm test

      - name: Smoke test sample book
        id: smoke
        continue-on-error: true
        run: |
          npm run example:install
          npm run example:build

      - name: Upload Playwright report and traces
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: sh .github/scripts/render-test-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Report check results
        if: always()
        run: |
          outcomes=(
            "${{ steps.test.outcome }}"
            "${{ steps.smoke.outcome }}"
          )
          for outcome in "${outcomes[@]}"; do
            [ "$outcome" = "success" ] || exit 1
          done

  quality:
    name: Quality Checks
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable npm
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Run linting
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run type checking
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Build project
        id: build
        continue-on-error: true
        run: npm run build

      - name: Check for unused files and dependencies
        id: knip
        continue-on-error: true
        run: npm run knip

      - name: Write job summary
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          KNIP_OUTCOME: ${{ steps.knip.outcome }}
        run: sh .github/scripts/render-quality-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Report check results
        if: always()
        run: |
          outcomes=(
            "${{ steps.format.outcome }}"
            "${{ steps.lint.outcome }}"
            "${{ steps.typecheck.outcome }}"
            "${{ steps.build.outcome }}"
            "${{ steps.knip.outcome }}"
          )
          for outcome in "${outcomes[@]}"; do
            [ "$outcome" = "success" ] || exit 1
          done
